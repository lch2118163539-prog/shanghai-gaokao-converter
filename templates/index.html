<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海高考分数换算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 540px;
            width: 100%;
            padding: 36px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 28px;
            font-size: 24px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid #667eea;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .form-row label {
            width: 60px;
            font-weight: 500;
            color: #555;
            flex-shrink: 0;
        }
        .form-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-row input:focus {
            border-color: #667eea;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .result {
            margin-top: 24px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
            display: none;
        }
        .result.show { display: block; }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e0e0e0;
        }
        .result-row:last-child { border: none; }
        .result-row.total {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            padding-top: 14px;
            margin-top: 6px;
            border-top: 2px solid #667eea;
        }
        .error {
            margin-top: 16px;
            padding: 12px;
            background: #fff0f0;
            border-radius: 8px;
            color: #e74c3c;
            display: none;
        }
        .error.show { display: block; }
        .elective-detail {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>上海高考分数换算器</h1>

        <div class="section-title">主三门（满分各150）</div>
        <div class="form-row">
            <label for="yuwen">语文</label>
            <input type="number" id="yuwen" placeholder="0-150" min="0" max="150" step="0.5">
        </div>
        <div class="form-row">
            <label for="shuxue">数学</label>
            <input type="number" id="shuxue" placeholder="0-150" min="0" max="150" step="0.5">
        </div>
        <div class="form-row">
            <label for="waiyu">外语</label>
            <input type="number" id="waiyu" placeholder="0-150" min="0" max="150" step="0.5">
        </div>

        <div class="section-title" style="margin-top:24px;">小三门（输入等级或分数）</div>
        <div class="hint">支持输入等级（A+, A, B+, ... , E）或合规分数（70, 67, ..., 40）</div>
        <div class="form-row">
            <label for="elective1">科目一</label>
            <input type="text" id="elective1" placeholder="如 A+ 或 70">
        </div>
        <div class="form-row">
            <label for="elective2">科目二</label>
            <input type="text" id="elective2" placeholder="如 A 或 67">
        </div>
        <div class="form-row">
            <label for="elective3">科目三</label>
            <input type="text" id="elective3" placeholder="如 B+ 或 64">
        </div>

        <button class="btn" onclick="calculate()">开始换算</button>

        <div class="error" id="error"></div>
        <div class="result" id="result">
            <div class="result-row">
                <span>主三门总分</span>
                <span id="main-total">-</span>
            </div>
            <div class="result-row">
                <span>小三门原分</span>
                <span id="elec-original">-</span>
            </div>
            <div class="result-row">
                <span>小三门换算分</span>
                <span id="elec-converted">-</span>
            </div>
            <div class="elective-detail" id="elec-detail"></div>
            <div class="result-row total">
                <span>换算后总分（满分750）</span>
                <span id="final-total">-</span>
            </div>
        </div>
    </div>

    <script>
        async function calculate() {
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            errorEl.classList.remove('show');
            resultEl.classList.remove('show');

            try {
                const yuwen = parseFloat(document.getElementById('yuwen').value);
                const shuxue = parseFloat(document.getElementById('shuxue').value);
                const waiyu = parseFloat(document.getElementById('waiyu').value);
                const e1 = document.getElementById('elective1').value.trim();
                const e2 = document.getElementById('elective2').value.trim();
                const e3 = document.getElementById('elective3').value.trim();

                if (isNaN(yuwen) || isNaN(shuxue) || isNaN(waiyu)) {
                    showError('请填写完整的主三门分数');
                    return;
                }
                if (!e1 || !e2 || !e3) {
                    showError('请填写完整的小三门结果');
                    return;
                }

                const resp = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ yuwen, shuxue, waiyu, elective1: e1, elective2: e2, elective3: e3 })
                });
                const data = await resp.json();

                if (!data.ok) {
                    showError(data.error);
                    return;
                }

                const r = data.result;
                document.getElementById('main-total').textContent = r.main_total + ' 分';
                document.getElementById('elec-original').textContent = r.original_elective_total + ' 分';
                document.getElementById('elec-converted').textContent = r.converted_elective_total + ' 分';
                document.getElementById('final-total').textContent = r.converted_total + ' 分';

                const details = r.elective_details.map(d =>
                    `${d.input} → 等级${d.grade} (原${d.score}分 → ${d.converted}分)`
                ).join('<br>');
                document.getElementById('elec-detail').innerHTML = details;

                resultEl.classList.add('show');
            } catch (e) {
                showError('请求失败: ' + e.message);
            }
        }

        function showError(msg) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }
    </script>
</body>
</html>
